<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="position-div">
        <div class="calculator-body">
            <div class="display">
                
            </div>
            <div class="buttons-div">
                <button class="clear">C</button>
                <button class="plus-minus">+/-</button>
                <button class="percent">%</button>
                <button class="divide operator">/</button>
                <button class="seven num">7</button>
                <button class="eight num">8</button>
                <button class="nine num">9</button>
                <button class="multiply operator">x</button>
                <button class="four num">4</button>
                <button class="five num">5</button>
                <button class="six num">6</button>
                <button class="subtract operator">-</button>
                <button class="one num">1</button>
                <button class="two num">2</button>
                <button class="three num">3</button>
                <button class="add operator">+</button>
                <button class="zero num">0</button>
                <button class="decimal num">.</button>
                <button class="equals operator">=</button>
            </div>
        </div>
    </div>
</body>
</html>
