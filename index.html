<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator-body">
        <div class="display">
            123
        </div>
        <div class="buttons-div">
            <button class="clear">C</button>
            <button class="divide operator">/</button>
            <button class="7 num">7</button>
            <button class="8 num">8</button>
            <button class="9 num">9</button>
            <button class="multiply operator">x</button>
            <button class="4 num">4</button>
            <button class="5 num">5</button>
            <button class="6 num">6</button>
            <button class="subtract operator">-</button>
            <button class="1 num">1</button>
            <button class="2 num">2</button>
            <button class="3 num">3</button>
            <button class="add operator">+</button>
            <button class="zero num">0</button>
            <button class="decimal num">.</button>
            <button class="equals operator">=</button>
        </div>
    </div>
</body>
</html>
